name: Rust

on:
  push:
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只保留 cross 支持的 Linux 平台
          - TARGET: x86_64-unknown-linux-musl
            FEATURES: ring-cipher,web
          - TARGET: aarch64-unknown-linux-musl
            FEATURES: normal,web
          - TARGET: armv7-unknown-linux-musleabihf
            FEATURES: normal,web
          # macOS 和 Windows 平台暂时保留原逻辑（cross 不支持）
          - TARGET: x86_64-apple-darwin
            OS: macos-latest
            FEATURES: ring-cipher,web
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            FEATURES: ring-cipher,web

    runs-on: ${{ matrix.OS || 'ubuntu-latest' }}
    env:
      NAME: szvbs
      TARGET: ${{ matrix.TARGET }}
      FEATURES: ${{ matrix.FEATURES }}

    steps:
      - uses: actions/checkout@v2

      - name: Install Rust and targets
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.TARGET }}
          profile: minimal

      - name: Install cross
        if: startsWith(matrix.OS, 'ubuntu')
        run: |
          cargo install cross

      - name: Build with cross
        if: startsWith(matrix.OS, 'ubuntu')
        run: |
          cross build --target $TARGET --release --features $FEATURES

      - name: Build for macOS
        if: matrix.TARGET == 'x86_64-apple-darwin'
        run: |
          rustup target add $TARGET
          cargo build --target $TARGET --release --features $FEATURES

      - name: Build for Windows
        if: matrix.TARGET == 'x86_64-pc-windows-msvc'
        run: |
          rustup target add $TARGET
          cargo build --target $TARGET --release --features $FEATURES

      - name: Compress
        run: |
          # 调试输出路径
          echo "Current dir: $(pwd)"
          ls -R ./target
          ls -R ./target/cross
          
          mkdir -p ./artifacts
          if [[ $TARGET == *linux* ]]; then
            EXEC=$NAME
          elif [[ $TARGET == *darwin* ]]; then
            EXEC=$NAME
          elif [[ $TARGET == *windows* ]]; then
            EXEC=$NAME.exe
          fi

          if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          # 根据平台调整输出路径
          if [[ $TARGET == *linux* ]]; then
            # 确保路径正确
            OUTPUT_PATH="./target/cross/$TARGET/release/"
            echo "Copying from: $OUTPUT_PATH$EXEC"
            cp $OUTPUT_PATH$EXEC ./$EXEC
          else
            cp ./target/$TARGET/release/$EXEC ./$EXEC
          fi

          tar -czf ./artifacts/$NAME-$TARGET-$TAG.tar.gz $EXEC

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: $NAME-${{ matrix.TARGET }}-${{ github.ref_name }}
          path: |
            ./artifacts/*.tar.gz

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: $NAME-*
          path: ./artifacts

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.YOURTOKEN }}
          file: ./artifacts/*.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
